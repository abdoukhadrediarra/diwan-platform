<footer class="site-footer">
  <div class="container">
    <div class="row gy-4">
      <div class="col-md-5">
        <div class="footer-brand-wrap">
          <img src="images/logo.png" alt="Logo Diwaan" class="footer-logo" width="48" height="48">
          <div>
            <p class="footer-brand"><span class="ar" lang="ar">ديوان</span> Diwaan</p>
            <p class="footer-tagline">Khassida Serigne Touba · Service et Héritage Spirituel</p>
          </div>
        </div>
        <p class="footer-text">{{ 'footer.brandDesc' | t }}</p>
      </div>
      <div class="col-md-7">
        <p class="footer-heading">{{ 'footer.sources' | t }}</p>
        <p class="footer-text">
          {{ 'footer.sourcesDesc' | t }}
        </p>
        <p class="footer-heading">{{ 'footer.xidma' | t }}</p>
        <p class="footer-text">{{ 'footer.xidmaText' | t }}</p>
      </div>
    </div>
    <p class="footer-copy">© {{ year }} {{ 'footer.copy' | t }}</p>
  </div>
</footer>
