<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <div class="row align-items-center gy-5">
      <div class="col-lg-7 order-2 order-lg-1">
        <p class="hero-arabic ar" lang="ar">الشيخ أحمد بمب</p>
        <h1 id="hero-title" class="hero-title">Cheikh Ahmadou Bamba</h1>
        <p class="hero-epithet">
          <span class="ar" lang="ar">خَادِمُ الرَّسُولِ</span>
          {{ 'hero.epithet' | t }}
        </p>
        <p class="hero-dates">{{ 'hero.dates' | t }}</p>
        <p class="hero-lede">
          {{ 'hero.lede' | t }}
        </p>
        <div class="hero-actions">
          <a class="btn btn-primary" routerLink="/diwans">{{ 'hero.ctaDiwans' | t }}</a>
          <a class="link-quiet" routerLink="/" fragment="cheikh">{{ 'hero.ctaBio' | t }}</a>
        </div>
      </div>

      <div class="col-lg-5 order-1 order-lg-2">
        <figure class="portrait">
          <div class="arch">
            <img ngSrc="images/cheikh-ahmadou-bamba.jpg" width="808" height="1280" priority
                 sizes="(min-width: 992px) 40vw, 80vw"
                 alt="Cheikh Ahmadou Bamba">
          </div>
          <figcaption>{{ 'hero.portraitCaption' | t }}</figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
